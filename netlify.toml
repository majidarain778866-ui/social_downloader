[build]
  command = "npm run netlify:prepare:linux && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  timeout = 26
  included_files = [
    "netlify/functions/bin/**"
  ]

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/api/video-info"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/download"
  to = "/.netlify/functions/api"
  status = 200

